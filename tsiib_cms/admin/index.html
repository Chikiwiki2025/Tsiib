<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Ts'íib · Panel editorial</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <link rel="icon" href="/images/logo-tsiib.png" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.17.1/dist/decap-cms.js"></script>
  <script>
    /* Vista previa con la tipografía y el estilo del sitio */
    CMS.registerPreviewStyle('https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap');
    CMS.registerPreviewStyle('/admin/preview.css');

    const MESES = ['Ene','Feb','Mar','Abr','Mayo','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    function fecha(v) {
      const s = v instanceof Date ? v.toISOString().slice(0,10) : String(v || '');
      const [y, m] = s.split('-').map(Number);
      return y && m ? MESES[m - 1] + ' ' + y : '';
    }

    const Preview = createClass({
      render() {
        const e = this.props.entry;
        const d = k => e.getIn(['data', k]);
        const img = d('image') ? this.props.getAsset(d('image')) : null;
        const tags = (d('tags') && d('tags').toJS) ? d('tags').toJS() : [];
        return h('article', { className: 'pv' },
          d('published') === false
            ? h('div', { className: 'pv-draft' }, 'Sin publicar — no aparece en el sitio')
            : null,
          h('header', { className: 'pv-head' },
            h('div', { className: 'pv-cat' }, h('span', { className: 'pv-line' }), d('category') || 'Sección'),
            h('h1', null, d('title') || 'Título del texto'),
            h('div', { className: 'pv-meta' },
              h('span', { className: 'pv-author' }, d('author') || 'Autor o autora'),
              h('span', null, '—'),
              h('span', null, fecha(d('date')))
            )
          ),
          h('div', { className: 'pv-text' },
            img ? h('figure', { className: 'pv-fig' },
              h('img', { src: img.toString(), alt: '' }),
              h('figcaption', null, d('caption') || ('Imagen · ' + (d('category') || '')))
            ) : null,
            h('div', { className: 'art-md' }, this.props.widgetFor('body'))
          ),
          tags.length ? h('div', { className: 'pv-tags' },
            h('span', { className: 'pv-tag-label' }, 'Temas'),
            tags.map((t, i) => h('span', { className: 'pv-tag', key: i }, t))
          ) : null
        );
      }
    });
    CMS.registerPreviewTemplate('articulos', Preview);
  </script>
</body>
</html>
